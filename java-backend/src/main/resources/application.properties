server.port=8080

# Default: in-memory H2 database (data is reloaded from the CSV on every start)
spring.datasource.url=jdbc:h2:mem:retail
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# ML output produced by:  python ml_models.py   (path is relative to where you start the app)
scores.csv.path=../ml_output/customer_scores.csv

# Python FastAPI ML service
python.service.url=http://localhost:8000
